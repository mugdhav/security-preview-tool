[project]
name = "security-preview"
version = "0.1.0"
description = "Deterministic, non-LLM static security scanner for a local project directory."
requires-python = ">=3.10"
dependencies = [
  "jinja2>=3.1",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
security-preview = "security_preview.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security_preview"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Deliberately insecure/idiomatic sample code used as SAST detection fixtures.
extend-exclude = ["tests/fixtures"]
