name: desktop-release

# Builds the double-click desktop app for Windows, macOS and Linux.
#  - push to a v* tag -> attach installers to a GitHub Release
#  - manual dispatch  -> build + upload artifacts only (no release)
#
# Signing is DORMANT until the matching repo secrets exist; every signing step
# no-ops when its secret is empty and the build simply ships UNSIGNED, with the
# one-time SmartScreen / Gatekeeper "allow" step documented in docs/DESKTOP.md.
#
# Windows Authenticode (any one provider):
#   WINDOWS_PFX_BASE64      base64 of a code-signing .pfx
#   WINDOWS_PFX_PASSWORD    its password
# Apple Developer ID + notarization:
#   APPLE_CERT_P12_BASE64   base64 of the "Developer ID Application" .p12
#   APPLE_CERT_P12_PASSWORD its password
#   APPLE_IDENTITY          e.g. "Developer ID Application: Acme (TEAMID)"
#   APPLE_TEAM_ID           10-char team id
#   APPLE_NOTARY_USER       Apple ID email
#   APPLE_NOTARY_PASSWORD   app-specific password

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      # Dogfood: scan our own tree before we package it.
      - run: python -m security_preview.cli scan . --format text --min-confidence high

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows }
          - { os: macos-latest,   target: macOS }
          - { os: ubuntu-latest,  target: linux }
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
      APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_NOTARY_USER: ${{ secrets.APPLE_NOTARY_USER }}
      APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Linux system deps for WebKitGTK
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev gir1.2-webkit2-4.1 gir1.2-gtk-3.0 \
            libcairo2-dev pkg-config python3-dev

      - run: python -m pip install -e ".[package]"

      - name: Smoke test the launcher
        run: python scripts/build_desktop.py check

      # --- macOS: load the Developer ID cert into a temp keychain (dormant) ----
      - name: Import Apple signing certificate
        if: matrix.target == 'macOS' && env.APPLE_CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Briefcase create + build
        run: |
          python -m briefcase create ${{ matrix.target }}
          python -m briefcase build ${{ matrix.target }}

      - name: Briefcase package (signed when an identity is configured)
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "macOS" ] && [ -n "$APPLE_IDENTITY" ]; then
            python -m briefcase package macOS --identity "$APPLE_IDENTITY"
          else
            python -m briefcase package ${{ matrix.target }} --adhoc-sign
          fi

      - name: Notarize + staple the macOS installer (dormant)
        if: matrix.target == 'macOS' && env.APPLE_NOTARY_PASSWORD != ''
        run: |
          for f in dist/*.dmg dist/*.pkg; do
            [ -e "$f" ] || continue
            xcrun notarytool submit "$f" --wait \
              --apple-id "$APPLE_NOTARY_USER" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_NOTARY_PASSWORD"
            xcrun stapler staple "$f"
          done

      - name: Portable PyInstaller build (Windows only)
        if: matrix.target == 'windows'
        run: python scripts/build_desktop.py portable

      - name: Inno Setup installer (Windows only)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" resources/installer/vulnascan.iss

      # --- Windows: Authenticode-sign every artifact (dormant) ---------------
      - name: Sign Windows artifacts
        if: matrix.target == 'windows' && env.WINDOWS_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          Get-ChildItem dist -Include *.msi,vulnascan*.exe,vulnascan-setup*.exe -Recurse |
            ForEach-Object {
              & $signtool sign /f $pfx /p $env:WINDOWS_PFX_PASSWORD `
                /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            }
          Remove-Item $pfx -Force

      - uses: actions/upload-artifact@v4
        with:
          name: vulnascan-${{ matrix.target }}
          path: |
            dist/*.msi
            dist/*.dmg
            dist/*.pkg
            dist/*.AppImage
            dist/*.deb
            dist/vulnascan*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
